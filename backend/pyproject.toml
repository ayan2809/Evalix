[project]
name = "evalix-backend"
version = "0.1.0"
description = "Evalix backend: runner, tool server, model door, faults, grading, scores"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tavily-python>=0.8.5",
  "maxim-py>=3.14.20",
  "google-auth>=2.35",
  "requests>=2.32",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
